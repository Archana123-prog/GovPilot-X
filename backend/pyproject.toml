[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "govpilot-x-backend"
version = "1.0.0"
description = "Startup-Friendly Public Procurement & Innovation Pilot Mechanism - Backend API"
requires-python = ">=3.11"
authors = [
    {name = "GovPilot-X Team", email = "info@govpilot-x.com"}
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.5",
    "google-generativeai>=0.7.0",
    "httpx>=0.27.0",
    "celery>=5.4.0",
    "redis>=5.0.4",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "supabase>=2.7.0",
    "python-dotenv>=1.0.1",
    "email-validator>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "flake8>=6.0.0",
    "isort>=5.12.0"
]

[tool.setuptools]
packages = ["routers", "services", "ai", "workers", "db", "models"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
py_version = "311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
